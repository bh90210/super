# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "SUPER"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "My Product Description"
vendor: "My Company"
homepage: "https://wails.io"
license: "MIT"
release: "1"

contents:
  - src: "./bin/SUPER"
    dst: "/usr/local/bin/SUPER"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/SUPER.png"
  - src: "./build/linux/SUPER.desktop"
    dst: "/usr/share/applications/SUPER.desktop"

# Wails v3 (>= beta) links against GTK4 / WebKitGTK 6.0 (libsoup3), not GTK3 /
# WebKit2. Keep these in sync with `ldd bin/SUPER`.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - libsoup-3.0-0

# replaces:
#   - foobar
# provides:
#   - bar
# depends:
#   - libgtk-4-1
#   - libwebkitgtk-6.0-4
#   - libsoup-3.0-0
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
scripts:
  # preinstall: ./build/linux/nfpm/scripts/preinstall.sh
  postinstall: ./build/linux/nfpm/scripts/postinstall.sh
  # preremove: ./build/linux/nfpm/scripts/preremove.sh
  postremove: ./build/linux/nfpm/scripts/postremove.sh
